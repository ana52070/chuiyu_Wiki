name: build check

# 目的：让 frontmatter 写错、构建报错这类问题在 commit / PR 上直接标红，
# 而不是等 Vercel 部署时才暴露（部署失败还容易被 GitHub 限流之类的
# 瞬时错误盖过去，看不出真实原因）。
#
# 2026-10-12 的事故就是这种：title 写成未加引号的 2026-04-08，
# YAML 解析成 Date，渲染阶段才抛 TypeError，而 Vercel 报的是 403 限流。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 校验 Markdown frontmatter
        run: npm run check:frontmatter

      - name: 校验图片引用
        run: npm run check:images

      - name: 构建站点
        run: npm run docs:build

      - name: 统计站点产物体积
        run: |
          echo "### 构建产物" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -sh .vitepress/dist >> "$GITHUB_STEP_SUMMARY"
          find .vitepress/dist -type f | wc -l | xargs echo "文件数:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
